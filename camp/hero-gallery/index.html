<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>히어로 22종 검토 (한 장씩)</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0e1311;color:#eef2ef;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{display:flex;flex-direction:column;height:100dvh}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#151b18;border-bottom:1px solid #222a26}
.bar b{font-size:16px}.no{font:700 14px monospace;color:#8fd3ae}.new{font-size:11px;font-weight:700;background:#16704a;color:#fff;padding:2px 7px;border-radius:99px}
.sp{flex:1}.fps{font:12px monospace;color:#9aa59f;min-width:70px;text-align:right}
button{font:inherit;font-size:14px;border:0;border-radius:10px;padding:8px 14px;background:#24302a;color:#fff;cursor:pointer}button:hover{background:#2f3d36}
select{font:inherit;font-size:13px;background:#24302a;color:#fff;border:0;border-radius:8px;padding:7px}
.stage{position:relative;flex:1;min-height:0}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.info{padding:10px 14px 12px;background:#151b18;border-top:1px solid #222a26;font-size:13px;line-height:1.55;color:#c9d2cc}
.info .chg{color:#8fd3ae;font-weight:600}.info code{font-size:12px;background:#222a26;padding:1px 5px;border-radius:4px;color:#dfe6e2}
@media(max-width:600px){.bar{flex-wrap:wrap;gap:6px 8px;padding:8px 10px}.bar b{font-size:14px}button{padding:7px 11px}select{max-width:130px}.info{font-size:12px;padding:8px 10px}}</style></head><body>
<div class="bar"><button id="prev" aria-label="이전">◀</button><span class="no" id="no"></span><b id="name"></b><span class="new" id="new" hidden>NEW</span><span class="sp"></span><span class="fps" id="fps"></span><select id="jump" aria-label="바로 가기"></select><button id="next" aria-label="다음">▶</button></div>
<div class="stage" id="stage"><iframe id="f" title="히어로 미리보기"></iframe></div>
<div class="info"><div class="chg" id="chg"></div><div id="meta"></div></div>
<script>
const H=[{"id": "night-sky", "emoji": "🌌", "name": "은하수 밤하늘", "image": "hero-night-sky.webp", "effect": "night-sky", "copy": "쏟아지는 은하수 아래 / 평창 밤하늘 캠핑", "no": 1, "note": "반딧불 글로우를 05번 입자 크기로 축소, 크기·밝기 랜덤(원근감), 밝기가 변하며 반짝임. 매 프레임 그라데이션 생성 제거로 최적화"}, {"id": "autumn-maple", "emoji": "🍁", "name": "가을 단풍", "image": "hero-autumn-maple.webp", "effect": "autumn-maple", "copy": "붉게 물든 가을 숲길 / 오색 단풍 캠핑", "no": 2, "note": "잎 모양·그림자를 미리 그려둔 이미지로 바꿔 매 프레임 그림자 계산 제거(버벅임 원인)"}, {"id": "rainy-camp", "emoji": "🌧️", "name": "감성 우중", "image": "hero-rainy-camp.webp", "effect": "rainy-camp", "copy": "타프 위 토닥이는 비 / 아늑한 우중 캠핑", "no": 3, "note": "빗줄기 그라데이션 반전: 아래쪽이 짙고 위로 갈수록 옅게"}, {"id": "snowy-winter", "emoji": "❄️", "name": "설경 윈터", "image": "hero-snowy-winter.webp", "effect": "snowy-winter", "copy": "새하얀 설원의 고요 / 고요한 설경 캠핑", "no": 4, "note": "모양은 그대로, 미리 그린 눈송이로 최적화"}, {"id": "lush-forest", "emoji": "🌲", "name": "편백 숲", "image": "hero-lush-forest.webp", "effect": "lush-forest", "copy": "피톤치드 가득한 숲길 / 편백숲 힐링 캠핑", "no": 5, "note": "블러 처리된 대각선 햇살 줄기가 짙어졌다 옅어지는 애니메이션 + 빛가루 강화"}, {"id": "riverside", "emoji": "🚣", "name": "호숫가 카약", "image": "hero-riverside.webp", "effect": "riverside", "copy": "물안개 피는 아침 강가 / 호숫가 카약 캠핑", "no": 6, "note": "윤슬 크기 전체 축소 + 수면 위로 천천히 흐르는 물안개 추가"}, {"id": "warm-bonfire", "emoji": "🔥", "name": "불멍 캠핑", "image": "hero-warm-bonfire.webp", "effect": "warm-bonfire", "copy": "타닥타닥 모닥불 소리 / 따스한 불멍 캠핑", "no": 7, "note": "불티 크기 축소, 속도를 느리고 유연하게, 크기 랜덤"}, {"id": "sunset-coast", "emoji": "🌅", "name": "서해안 노을", "image": "hero-sunset-coast.webp", "effect": "sunset-coast", "copy": "노을이 내려앉은 바다 / 서해 노을 캠핑", "no": 8, "note": "윤슬을 해 아래 세로 기둥으로 정렬, 빛 기둥이 좌우로 살짝 흔들리며 반짝임"}, {"id": "cherry-blossom", "emoji": "🌸", "name": "봄날 벚꽃", "image": "hero-cherry-blossom.webp", "effect": "cherry-blossom", "copy": "흩날리는 분홍 꽃비 / 봄날 벚꽃 캠핑", "no": 9, "note": "꽃잎을 미리 그린 이미지로 바꾸고 그림자 계산 제거, 개수 85→55(최적화)"}, {"id": "green-meadow", "emoji": "🌿", "name": "초원 글램핑", "image": "hero-green-meadow.webp", "effect": "green-meadow", "copy": "끝없는 초록빛 언덕 / 대관령 초원 캠핑", "no": 10, "note": "홀씨 크기 축소, 크기·투명도 랜덤(원근감), 한 방향으로 살랑 부는 바람"}, {"id": "uq-hotspring", "emoji": "♨️", "name": "노천탕", "image": "hero-hotspring.webp", "effect": "uq-hotspring", "copy": "별 아래 따끈한 노천탕 / 노천탕 캠핑", "no": 11, "note": "노천탕 김이 모락모락 피어오름 + 밤하늘 작은 별 반짝임"}, {"id": "uq-spa", "emoji": "🛁", "name": "스파", "image": "hero-spa.webp", "effect": "uq-spa", "copy": "캔들 불빛 아래 보글보글 / 프라이빗 스파 캠핑", "no": 12, "note": "비누방울 크기·투명도 다양화, 더 천천히 오르다 중간에 팡 터짐(누르면 터짐)"}, {"id": "uq-warmpool", "emoji": "🌡️", "name": "사계절온수풀", "image": "hero-warmpool.webp", "effect": "uq-warmpool", "copy": "눈 내리는 날에도 첨벙 / 사계절 온수풀 캠핑", "no": 13, "note": "온수풀 김이 피어오르면서 눈이 내림"}, {"id": "uq-pool", "emoji": "🏊", "name": "수영장", "image": "hero-pool.webp", "effect": "uq-pool", "copy": "반짝이는 물빛 속으로 / 수영장 캠핑", "no": 14, "note": "비누방울 제거, 수면 여기저기 물방울이 튀고 물결·윤슬(누르면 첨벙)"}, {"id": "uq-horse", "emoji": "🐎", "name": "승마", "image": "hero-horse.webp", "effect": "uq-horse", "copy": "노을 진 초원을 달려 / 승마 체험 캠핑", "no": 15, "note": "민들레 대신 풀잎이 바람에 날림, 노을 중심으로 빛이 밝아졌다 어두워짐"}, {"id": "uq-animal", "emoji": "🦙", "name": "동물체험", "image": "hero-animal.webp", "effect": "uq-animal", "copy": "보들보들 동물 친구와 / 동물 체험 캠핑", "no": 16, "note": "벚꽃 대신 노랑·분홍·흰색·보라 꽃잎"}, {"id": "uq-kidscafe", "emoji": "🧸", "name": "키즈카페", "image": "hero-kidscafe.webp", "effect": "uq-kidscafe", "copy": "아이들의 웃음이 가득 / 키즈카페 캠핑", "no": 17, "note": "폭죽이 터지고, 누르면 그 자리에서 폭죽이 터짐 + 색종이 크게·랜덤 크기"}, {"id": "uq-indoorplay", "emoji": "🎲", "name": "실내놀이", "image": "hero-indoorplay.webp", "effect": "uq-indoorplay", "copy": "비가 와도 신나는 하루 / 실내놀이 캠핑", "no": 18, "note": "색종이 크게·랜덤 크기"}, {"id": "uq-treehouse", "emoji": "🌳", "name": "트리하우스", "image": "hero-treehouse.webp", "effect": "uq-treehouse", "copy": "나무 위 작은 오두막 / 트리하우스 캠핑", "no": 19, "note": "블러 처리된 대각선 빛줄기가 천천히 숨쉬듯 변함(더 자연스럽게)"}, {"id": "uq-stay", "emoji": "🫧", "name": "이색숙소", "image": "hero-uniquestay.webp", "effect": "uq-stay", "copy": "투명 돔 안에서 별 보기 / 이색 숙소 캠핑", "no": 20, "note": "반딧불 제거, 하얀 별빛 반짝임 + 유성우"}, {"id": "uq-leisure", "emoji": "🪂", "name": "레포츠", "image": "hero-leisure.webp", "effect": "uq-leisure", "copy": "강 위를 가르는 짜릿함 / 레포츠 캠핑", "no": 21, "note": "이미지 속 와이어를 따라 짚라인 타는 사람이 가끔 지나감 + 강물 윤슬"}, {"id": "uq-farm", "emoji": "🍓", "name": "체험", "image": "hero-farm.webp", "effect": "uq-farm", "copy": "직접 따고 만드는 하루 / 농촌 체험 캠핑", "no": 22, "note": "민들레 제거, 오른쪽 위 햇살 글로우와 빛줄기가 은은하게 내리쬠"}];let i=0,fpsT=null;const $=(id)=>document.getElementById(id);
H.forEach((h,k)=>{const o=document.createElement("option");o.value=k;o.textContent=String(k+1).padStart(2,"0")+" "+h.emoji+" "+h.name;$("jump").appendChild(o)});
function show(k,push=true){i=(k+H.length)%H.length;const h=H[i];
 $("no").textContent=String(i+1).padStart(2,"0");$("name").textContent=h.emoji+" "+h.name;$("new").hidden=i<10;$("jump").value=i;
 $("chg").textContent="이번 수정: "+h.note;
 $("meta").innerHTML="카피 "+h.copy+" · 이미지 <code>"+h.image+"</code> · 효과 <code>"+h.effect+"</code>";
 // 한 번에 하나의 효과만: iframe 하나를 새 주소로 교체(이전 효과는 페이지째 종료)
 const f=$("f");f.src="about:blank";setTimeout(()=>{f.src="../?hero="+encodeURIComponent(h.id)},30);
 if(push)history.replaceState(null,"","#"+String(i+1).padStart(2,"0"));measure();}
function measure(){clearInterval(fpsT);$("fps").textContent="";let w=null,n=0,t0=0;
 fpsT=setInterval(()=>{try{const cw=$("f").contentWindow;if(!cw||cw.location.href==="about:blank")return;
  if(w!==cw){w=cw;n=0;t0=cw.performance.now();const tick=()=>{n++;if(w===cw)cw.requestAnimationFrame(tick)};cw.requestAnimationFrame(tick);return}
  const t=cw.performance.now();if(t-t0>=1000){$("fps").textContent=Math.round(n*1000/(t-t0))+" fps";n=0;t0=t}}catch(e){}},250)}
$("prev").onclick=()=>show(i-1);$("next").onclick=()=>show(i+1);$("jump").onchange=(e)=>show(+e.target.value);
addEventListener("keydown",(e)=>{if(e.key==="ArrowLeft")show(i-1);else if(e.key==="ArrowRight")show(i+1)});
// 스와이프: 아래 정보 영역·상단 바에서 좌우로 밀기(히어로 안의 터치는 효과용으로 남김)
let sx=null;for(const el of [document.querySelector(".bar"),document.querySelector(".info")]){el.addEventListener("touchstart",(e)=>{sx=e.touches[0].clientX},{passive:true});el.addEventListener("touchend",(e)=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)show(i+(dx<0?1:-1));sx=null},{passive:true})}
// iframe 안에서의 스와이프도 전달
$("f").addEventListener("load",()=>{try{const d=$("f").contentDocument;let x0=null,y0=null;d.addEventListener("touchstart",(e)=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});d.addEventListener("touchend",(e)=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)show(i+(dx<0?1:-1));x0=null},{passive:true});d.addEventListener("keydown",(e)=>{if(e.key==="ArrowLeft")show(i-1);else if(e.key==="ArrowRight")show(i+1)})}catch(e){}});
const m=/^#(\d+)/.exec(location.hash);show(m?+m[1]-1:0,false);
</script></body></html>
